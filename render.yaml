services:
  - type: web
    name: axel-ghl
    runtime: python
    region: virginia
    plan: free
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt
    startCommand: python init_storage.py && gunicorn -c gunicorn.conf.py wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: AXEL_STORAGE_MODE
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: AXEL_DATA_DIR
        value: /tmp/axel
      - key: AXEL_ADMIN_USER
        value: admin
      - key: AXEL_ADMIN_PASSWORD
        sync: false
      - key: AXEL_SECRET_KEY
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "1"
