<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AXEL — captura automática</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header><span class="mark">A</span><div><strong>AXEL</strong><small>Captura automática do GHL</small></div></header>
    <p id="status">As sessões ficam apenas na memória enquanto este navegador está aberto.</p>
    <ul id="accounts"></ul>
    <button id="clear" type="button">Limpar sessões capturadas</button>
    <small class="privacy">A extensão observa somente chamadas ao endpoint de modelos do WhatsApp. Ela não envia tokens para outro serviço.</small>
  </main>
  <script src="popup.js"></script>
</body>
